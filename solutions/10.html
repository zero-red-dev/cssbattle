<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>solution</title>
  </head>
  <body>
    <div></div>
    <div class="middle"></div>
    <div></div>
    <style>
      body {
        background: #62306d;
        height: 90dvh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: end;
      }
      div {
        width: 100px;
        height: 150px;
        background: #f7ec7d;
        border-radius: 50px 50px 0 0;
      }
      div::after {
        content: "";
        display: flex;
        width: 100%;
        height: 100px;
        background: #e38f66;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        box-shadow: inset 0 0 0 20px #aa445f;
      }
      .middle {
        height: 250px;
      }
      .middle::after {
        background: #aa445f;
        box-shadow: inset 0 0 0 20px #e38f66;
      }
    </style>
  </body>
</html>
