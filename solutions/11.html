<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>solution</title>
  </head>
  <body>
    <div class="start"></div>
    <div class="middle">
      <div></div>
    </div>
    <div class="end"></div>
    <style>
      body {
        background: #191210;
        height: 90dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .middle {
        width: 100px;
        height: 100px;
        border: 20px solid #eca03d;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .middle div {
        background: #84271c;
        height: 50px;
        width: 50px;
        border-radius: 50%;
      }
      .end {
        width: 60px;
        height: 60px;
        position: absolute;
        border: 20px solid #eca03d;
        border-radius: 50%;
        border-block-end-color: transparent;
        border-inline-start-color: transparent;
        transform: translateX(100px) rotate(-45deg);
      }
      .start {
        width: 60px;
        height: 60px;
        position: absolute;
        border: 20px solid #eca03d;
        border-radius: 50%;
        border-block-start-color: transparent;
        border-inline-end-color: transparent;
        transform: translateX(-100px) rotate(-45deg);
      }
    </style>
  </body>
</html>
