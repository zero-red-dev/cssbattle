<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>solution</title>
  </head>
  <body>
    <div></div>
    <div id="s1"></div>
    <div id="s2"></div>
    <div id="circle"></div>
    <style>
      body {
        background: #222730;
        height: 90dvh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      div {
        width: 400px;
        height: 150px;
        background: #4caab3;
      }
      #s1 {
        width: 250px;
        height: 250px;
        transform: rotate(45deg);
        background: #222730;
        position: absolute;
      }
      #s2 {
        width: 150px;
        height: 150px;
        transform: rotate(45deg);
        background: #4caab3;
        position: absolute;
      }
      #circle {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        position: absolute;
        background: #393e46;
      }
    </style>
